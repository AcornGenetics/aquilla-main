name: build-and-push-images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ring_tag:
        description: Optional ring tag to publish (sandbox/dev/pilot/prod)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase repo
        run: echo "REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Computed in a step rather than read from github.event.head_commit, which
      # is absent on workflow_dispatch. Baked into both images so a device can
      # report its own provenance — see #351.
      - name: Stamp build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          # arm64 only — the fleet runs 64-bit Pi OS and nothing consumes the amd64
          # variant. QEMU above is still required: the runner is amd64, so the arm64
          # build is emulated. See #348.
          platforms: linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-api:latest
            ghcr.io/${{ env.REPO_LOWER }}-api:${{ github.sha }}
            ${{ inputs.ring_tag && format('ghcr.io/{0}-api:{1}', env.REPO_LOWER, inputs.ring_tag) || '' }}
          # Runners are ephemeral, so without an external cache buildx starts cold every
          # run and re-executes `pip install`. pip output is not byte-reproducible
          # (timestamps, .pyc, wheel metadata ordering), so that layer got a fresh digest
          # every build — meaning devices re-pulled the whole ~889 MB image for a one-line
          # change. Reusing the layer preserves its digest, so pushes, device pulls and
          # on-device storage all dedupe against what they already have. See #348.
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-api:buildcache,mode=max

      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ui
          platforms: linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-ui:latest
            ghcr.io/${{ env.REPO_LOWER }}-ui:${{ github.sha }}
            ${{ inputs.ring_tag && format('ghcr.io/{0}-ui:{1}', env.REPO_LOWER, inputs.ring_tag) || '' }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-ui:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}-ui:buildcache,mode=max
